name: Compile DS Homebrew

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install devkitPro pacman repository
        run: |
          sudo apt-get update
          sudo apt-get install -y curl lsb-release wget
          sudo dkp-pacman --version || {
            echo "Installing devkitPro pacman..."
            wget https://github.com/devkitPro/pacman/releases/download/v1.0.2/devkitpro-pacman.amd.deb
            sudo dpkg -i devkitpro-pacman.amd.deb || sudo apt-get install -f -y
          }

      - name: Install libnds and tools
        run: |
          sudo dkp-pacman -Syyu --noconfirm
          sudo dkp-pacman -S --noconfirm nds-portlibs libnds grit make

      - name: Build NDS ROM
        run: |
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberQuest-NDS
          path: |
            *.nds
            
