name: Compile DS Homebrew

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/base:latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install libnds and tools
        run: |
          dkp-pacman -Syyu --noconfirm
          dkp-pacman -S --noconfirm dsi-defaults nds-portlibs libnds grit
          
      - name: Build NDS ROM
        run: |
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberQuest-NDS
          path: |
            *.nds
            
